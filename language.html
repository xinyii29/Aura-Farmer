<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AuraFarmer - Choose Language</title>
  <link rel="stylesheet" href="language.css" />
</head>
<body>

  <!-- Floating particles background -->
  <div class="particles" id="particles"></div>

  <div class="hero">
    <h1 class="title">I want to learn...</h1>

<div class="lang-grid">
  <button class="lang-btn" onclick="selectLanguage('Mandarin', this)">
      <span class="lang-native">简体中文</span>
      <span class="lang-english">Mandarin</span>
     </button>

     <button class="lang-btn" onclick="selectLanguage('Malay', this)">
      <span class="lang-native">Bahasa Melayu</span>
      <span class="lang-english">Malay</span>
     </button>

     <button class="lang-btn" onclick="selectLanguage('Cantonese', this)">
      <span class="lang-native">粤语</span>
      <span class="lang-english">Cantonese</span>
     </button>

     <button class="lang-btn" onclick="selectLanguage('Russian', this)">
      <span class="lang-native">Русский</span>
      <span class="lang-english">Russian</span>
     </button>

    </div>
  </div>
</div>
    
  <script src="language.js"></script>
</body>
</html>
