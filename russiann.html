<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language Quiz Game</title>
    <link rel="stylesheet" href="stylerussian.css">

</head>
<body>
    
    <div class="config-container">
        <h2 class="config-title">Challenge Yourself!</h2>
        <h3 class="config-subtitle">😍 Unlock a new world through Russian! 🙌</h3>
        <hr>

        <div class="config-option">
            <h4 class="option-title">~ Select level ~ </h4>
            <div class="level-options">

                <a href="quiz.html?lang=russian&level=1"><button>1</button></a>
                <a href="quiz.html?lang=russian&level=2"><button>2</button></a>
                <a href="quiz.html?lang=russian&level=3"><button>3</button></a>
                <a href="quiz.html?lang=russian&level=4"><button>4</button></a>
                <a href="quiz.html?lang=russian&level=5"><button>5</button></a>
                <a href="quiz.html?lang=russian&level=6"><button>6</button></a>
                <a href="quiz.html?lang=russian&level=7"><button>7</button></a>
                <a href="quiz.html?lang=russian&level=8"><button>8</button></a>
                <a href="quiz.html?lang=russian&level=9"><button>9</button></a>
                <a href="quiz.html?lang=russian&level=10"><button>10</button></a>
                <a href="quiz.html?lang=russian&level=11"><button>11</button></a>
                <a href="quiz.html?lang=russian&level=12"><button>12</button></a>     
                <a href="quiz.html?lang=russian&level=13"><button>13</button></a>
                <a href="quiz.html?lang=russian&level=14"><button>14</button></a>
                <a href="quiz.html?lang=russian&level=15"><button>15</button></a>

            </div>
        </div>
        <audio id="clickSound" src="audio/click.mp3"></audio>

<script>
document.querySelectorAll(".level-options a").forEach(link => {
    link.addEventListener("click",function(e){
        e.preventDefault();

        const sound = document.getElementById("clickSound");
        sound.currentTime = 0;
        sound.play();

        const url = this.href;

        setTimeout(() => {
            window.location.href = url;
        },500);
    });
}); 
</script>

    </div>

    <div class="sticker snow">❄️</div>
    <div class="sticker bear">🧸</div>
    <div class="sticker moon">🌙</div>
    <div class="sticker heart">💜</div>

</body>
</html>
